<!DOCTYPE html>
<html>

<head>
<title>Product Management</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<h2>Product Management</h2>

<table>
<tr>
<th>Product</th>
<th>Unit Price</th>
<th>Quantity</th>
<th>Total</th>
</tr>

<tr>
<td>Product A</td>
<td>1000</td>
<td><input type="number" class="qty" data-price="1000" value="0" min="0"></td>
<td><input type="text" class="total" readonly value="0"></td>
</tr>

<tr>
<td>Product B</td>
<td>500</td>
<td><input type="number" class="qty" data-price="500" value="0" min="0"></td>
<td><input type="text" class="total" readonly value="0"></td>
</tr>

<tr>
<td>Product C</td>
<td>200</td>
<td><input type="number" class="qty" data-price="200" value="0" min="0"></td>
<td><input type="text" class="total" readonly value="0"></td>
</tr>

</table>

<script src="script.js"></script>

</body>
</html>
