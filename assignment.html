<!DOCTYPE html>
<html lang="en">
<head>
<title>Person Profile</title>

<style>
    body {
        font-family: Arial, sans-serif;
    }

    table {
        width: 600px;
        border-collapse: collapse;
        margin: auto;
    }

    td {
        border: 1px solid #000;
        padding: 10px;
        vertical-align: middle;
    }

    .title {
        text-align: center;
        font-size: 22px;
        font-weight: bold;
    }

    .label {
        width: 150px;
        font-weight: bold;
    }

    .buttons {
        text-align: right;
    }

    .error {
        color: red;
        text-align: center;
        font-size: 14px;
    }
</style>
</head>

<body>

<form onsubmit="return validate_Form()">

<table>
    <tr>
        <td colspan="2" class="title">PERSON PROFILE</td>
    </tr>

    <tr>
        <td class="label">Name</td>
        <td><input type="text" id="name" style="width:300px;"></td>
    </tr>

    <tr>
        <td class="label">Email</td>
        <td><input type="text" id="email" style="width:300px;"></td>
    </tr>

    <tr>
        <td class="label">Gender</td>
        <td>
            <input type="radio" name="gender"> Male
            <input type="radio" name="gender"> Female
            <input type="radio" name="gender"> Other
        </td>
    </tr>

    <tr>
        <td class="label">Date of Birth</td>
        <td>
            <input type="text" id="dd" size="2"> /
            <input type="text" id="mm" size="2"> /
            <input type="text" id="yyyy" size="4">
            <small>(dd/mm/yyyy)</small>
        </td>
    </tr>

    <tr>
        <td class="label">Blood Group</td>
        <td>
            <select id="blood">
                <option value="">Select</option>
                <option>A+</option><option>A-</option>
                <option>B+</option><option>B-</option>
                <option>O+</option><option>O-</option>
                <option>AB+</option><option>AB-</option>
            </select>
        </td>
    </tr>

    <tr>
        <td class="label">Degree</td>
        <td>
            <input type="checkbox" name="degree"> SSC
            <input type="checkbox" name="degree"> HSC
            <input type="checkbox" name="degree"> BSc.
            <input type="checkbox" name="degree"> MSc.
        </td>
    </tr>

    <tr>
        <td class="label">Photo</td>
        <td><input type="file" id="photo"></td>
    </tr>

    <tr>
        <td colspan="2" class="buttons">
            <input type="submit" value="Submit">
            <input type="reset" value="Reset">
        </td>
    </tr>

    <tr>
        <td colspan="2" class="error" id="error"></td>
    </tr>
</table>

</form>

<script>
function validate_Form() {
    let error = document.getElementById("error");
    error.innerHTML = "";

    let name = document.getElementById("name").value.trim();
    let email = document.getElementById("email").value.trim();
    let dd = parseInt(document.getElementById("dd").value);
    let mm = parseInt(document.getElementById("mm").value);
    let yyyy = parseInt(document.getElementById("yyyy").value);
    let blood = document.getElementById("blood").value;
    let photo = document.getElementById("photo").value;

    if (name === "") { error.innerHTML = "Name required"; return false; }
    if (email === "") { error.innerHTML = "Email required"; return false; }
    if (!document.querySelector('input[name="gender"]:checked')) {
        error.innerHTML = "Select gender"; return false;
    }
    if (!(dd>=1 && dd<=31 && mm>=1 && mm<=12 && yyyy>=1900 && yyyy<=2026)) {
        error.innerHTML = "Invalid date of birth"; return false;
    }
    if (blood === "") { error.innerHTML = "Select blood group"; return false; }
    if (document.querySelectorAll('input[name="degree"]:checked').length === 0) {
        error.innerHTML = "Select at least one degree"; return false;
    }
    if (photo === "") { error.innerHTML = "Upload photo"; return false; }

    alert("Form submitted successfully!");
    return true;
}
</script>

</body>
</html>
